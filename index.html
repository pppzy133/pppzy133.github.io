<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · 影像作品集</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="profile">
        <img src="./assets/images/avatar.jpg" alt="头像" class="avatar">
        <div class="intro">
          <h1>Miles</h1>
          <p>新媒体 · 纪实影像 · 短视频 · 航拍导播</p>
          <div class="action-buttons">
            <a href="#" class="btn-primary">下载简历</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="works">
    <div class="container">
      <h2>精选作品</h2>

      <!-- 筛选标签 -->
      <div class="filter-tabs">
        <button data-filter="all" class="tab active">全部</button>
        <button data-filter="doc">纪实</button>
        <button data-filter="aero">航拍</button>
        <button data-filter="short">短视频</button>
        <button data-filter="live">活动导播</button>
      </div>

      <div class="card-list">
        <a href="#" class="card" data-cat="doc">
          <img src="./assets/images/cover_1.jpg" alt="乡土人文纪实">
          <span class="tag">纪实</span>
          <div class="card-body">
            <h3>乡土人文纪实</h3>
            <p>记录在地民俗与城市碎片，留住镜头里的温度。</p>
          </div>
        </a>

        <a href="#" class="card" data-cat="short">
          <img src="./assets/images/cover_2.jpg" alt="故事演绎短视频">
          <span class="tag">短视频</span>
          <div class="card-body">
            <h3>故事演绎短片</h3>
            <p>强共情叙事，适合账号传播与品牌定制内容。</p>
          </div>
        </a>

        <a href="#" class="card" data-cat="aero">
          <img src="./assets/images/cover_3.jpg" alt="航拍视觉大片">
          <span class="tag">航拍</span>
          <div class="card-body">
            <h3>航拍视觉大片</h3>
            <p>高空视角，大气镜头调度与精细后期调色。</p>
          </div>
        </a>

        <a href="#" class="card" data-cat="doc">
          <img src="./assets/images/cover_4.jpg" alt="闽地民俗纪实">
          <span class="tag">纪实</span>
          <div class="card-body">
            <h3>闽地民俗纪实</h3>
            <p>游街、泥塑、送王船，捕捉本土民俗鲜活瞬间。</p>
          </div>
        </a>

        <a href="#" class="card" data-cat="live">
          <img src="./assets/images/cover_5.jpg" alt="多机位导播">
          <span class="tag">活动导播</span>
          <div class="card-body">
            <h3>多机位活动导播</h3>
            <p>现场录制、导播切换与直播信号调度。</p>
          </div>
        </a>

        <a href="#" class="card" data-cat="aero">
          <img src="./assets/images/cover_6.jpg" alt="城市航拍叙事">
          <span class="tag">航拍</span>
          <div class="card-body">
            <h3>城市航拍叙事</h3>
            <p>从高空阅读城市，用航拍讲空间故事。</p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>联系 · 合作 · 影像项目邀约</p>
      <div class="social-links">
        <a href="#">抖音</a>
        <a href="#">B站</a>
      </div>
    </div>
  </footer>

  <script src="./filter.js"></script>
</body>
</html>

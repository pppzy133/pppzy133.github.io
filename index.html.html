<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles · 作品集</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="profile">
        <img src="./assets/images/avatar.jpg" alt="头像" class="avatar">
        <div class="intro">
          <h1>Miles</h1>
          <p>新媒体｜纪实影像｜短视频创作</p>
        </div>
      </div>
    </div>
  </header>

  <main class="works">
    <div class="container">
      <h2>精选作品</h2>
      <div class="card-list">
        <div class="card">
          <img src="./assets/images/cover_1.jpg" alt="作品 1">
          <div class="card-body">
            <h3>纪实短片 · 乡土人文</h3>
            <p>记录在地民俗与城市碎片，用镜头留住温度。</p>
          </div>
        </div>
        <div class="card">
          <img src="./assets/images/cover_2.jpg" alt="作品 2">
          <div class="card-body">
            <h3>短视频 · 故事演绎</h3>
            <p>强共情叙事，适合账号传播与品牌内容。</p>
          </div>
        </div>
        <div class="card">
          <img src="./assets/images/cover_3.jpg" alt="作品 3">
          <div class="card-body">
            <h3>航拍 · 视觉大片</h3>
            <p>高空视角，大气镜头调度与后期调色。</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>联系 · 合作 · 影像项目邀约</p>
    </div>
  </footer>
</body>
</html>
